// riffle shuffles keep the old order visible
function seeded(seed) { let s = seed >>> 0; return () => { s += 0x6D2B79F5; let q = Math.imul(s ^ s >>> 15, 1 | s); q ^= q + Math.imul(q ^ q >>> 7, 61 | q); return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
function riffle(arr, r) {

    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + ax, py + ay); ctx.lineTo(px + ax + bx, py + ay + by); ctx.lineTo(px + bx, py + by); ctx.closePath();
    ctx.fillStyle = cols[Math.floor(r() * 6)]; ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.stroke(); } };
  face(0, -s * 1.5, s * .87, s * .5, -s * .87, s * .5);

  face(0, s * 1.5, s * .87, -s * .5, 0, s);
}
