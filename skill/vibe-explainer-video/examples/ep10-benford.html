function bars(t, x0, base, bw, gap, k, flat, a = 1) {

  ctx.save(); ctx.setLineDash([10, 8]); ctx.strokeStyle = 'rgba(242,237,227,0.45)'; ctx.lineWidth = 2;

// a worn book of logarithm tables, seen from the fore-edge: early pages grimy
function logBook(x, y, w, h, k, t) {
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha *= k;
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  rrect(x - 16, y - 16, w + 32, h + 32, 10); ctx.fillStyle = '#4A2E1C'; ctx.fill(); ctx.shadowColor = 'transparent';
  for (let i = 0; i < 90; i++) {
    const u = i / 89, yy = y + u * h, grime = Math.pow(1 - u, 1.6);
    const r = Math.round(lerp(236, 96, grime)), g = Math.round(lerp(226, 74, grime)), b = Math.round(lerp(204, 48, grime));
    ctx.fillStyle = `rgb(${r},${g},${b})`; ctx.fillRect(x, yy, w, h / 90 + .6);
  }
  // section tabs 1…9 down the edge
  for (let d = 1; d <= 9; d++) {
    const yy = y + Math.log10(d) * h;
    line(x - 6, yy, x + w + 6, yy, 'rgba(60,40,20,0.6)', 2);
    txt(String(d), x - 40, yy + Math.min(46, Math.log10((d + 1) / d) * h / 2) + 12, { size: 34, weight: 700, font: MONO, color: d === 1 ? C.goldHi : C.ink2 });

  ctx.restore();
}
