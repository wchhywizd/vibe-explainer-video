// 选题 7 · 赌徒谬论 ——《号码不记得》全片（168 拍 = 134.4 秒）
// 一张“第一位号码”走势图：10 列（0–9），每期一个开奖号；7 已经 30 期没出现
const ROWS = (() => { let s = 11 >>> 0; const r = () => { s += 0x6D2B79F5; let q = Math.imul(s ^ s >>> 15, 1 | s); q ^= q + Math.imul(q ^ q >>> 7, 61 | q); return ((q ^ q >>> 14) >>> 0) / 4294967296; };
  const a = []; for (let i = 0; i < 44; i++) { let d; do { d = Math.floor(r() * 10); } while (d === 7); a.push(d); } return a; })();
const CH = { x: 760, y: 118, colW: 94, rowH: 34, cols: 10, rows: 18 };
function trendChart(t, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  const { x, y, colW, rowH, cols, rows } = CH;
  const w = colW * cols + 150, h = rowH * (rows + 3) + 20;

  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  ctx.fillStyle = PAT; ctx.fillRect(x - 20, y - 20, w, h); ctx.shadowColor = 'transparent';

  txt('第一位 · 走势图', x + 10, y + 26, { size: 26, weight: 900, color: C.pInk, align: 'left', font: SERIF });
  for (let c = 0; c < cols; c++) txt(String(c), x + 130 + c * colW, y + 66, { size: 26, weight: 700, color: c === 7 ? C.seal : C.pInk, font: MONO });

  const scroll = (t / BEAT) % 1, base = Math.floor(t / BEAT);
  ctx.save(); ctx.beginPath(); ctx.rect(x - 20, y + 80, w, rowH * rows); ctx.clip();
  for (let i = 0; i < rows + 2; i++) {
    const idx = (base + i) % ROWS.length, ry = y + 80 + (i - scroll) * rowH;
    const period = 2026120 + idx;
    if (i % 2) { ctx.fillStyle = 'rgba(43,39,35,0.04)'; ctx.fillRect(x - 20, ry, w, rowH); }
    txt(String(period), x + 10, ry + 21, { size: 16, color: C.pInk2, align: 'left', font: MONO });
    for (let c = 0; c < cols; c++) {
      const cx = x + 130 + c * colW, cy = ry + rowH / 2;
      if (ROWS[idx] === c) { circle(cx, cy, 12, '#C8372D'); txt(String(c), cx, cy + 6, { size: 16, weight: 700, color: '#fff', font: MONO }); }
      else txt(String(1 + ((idx * 7 + c * 3) % 9)), cx, cy + 6, { size: 14, color: 'rgba(43,39,35,0.28)', font: MONO });
    }
  }
  ctx.restore();
  // 遗漏 row
  const my = y + 80 + rowH * rows + 8;

  txt('当前遗漏', x + 10, my + 26, { size: 18, weight: 700, color: C.pInk, align: 'left' });
  for (let c = 0; c < cols; c++) txt(c === 7 ? '30' : String([2, 5, 1, 9, 3, 6, 4, 0, 8, 2][c]), x + 130 + c * colW, my + 26, { size: c === 7 ? 26 : 18, weight: c === 7 ? 900 : 500, color: c === 7 ? C.seal : C.pInk2, font: MONO });
  // column 7 empty strip
  ctx.fillStyle = 'rgba(200,55,45,0.06)'; ctx.fillRect(x + 130 + 7 * colW - colW / 2, y + 80, colW, rowH * rows);
  ctx.restore();
}
function marker(t) {          // a red marker-pen loop around 遗漏 30 and the empty column
  const k = eio(segB(t, 0.6, 2.2));
  if (k <= 0) return;
  const cx = CH.x + 130 + 7 * CH.colW, cy = CH.y + 80 + CH.rowH * CH.rows + 34;
  ctx.save(); ctx.strokeStyle = 'rgba(214,40,40,0.9)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i <= 80 * k; i++) { const a = -1.6 + i / 80 * 6.6, r = 36 + Math.sin(i * .7) * 2; const px = cx + Math.cos(a) * r * 1.2, py = cy + Math.sin(a) * r * .8; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.stroke();
  const a2 = eio(segB(t, 1.6, 2.6));
  ctx.beginPath(); ctx.moveTo(cx + 50, cy - 40); ctx.lineTo(cx + 50 + 160 * a2, cy - 40 - 120 * a2); ctx.stroke();
  if (a2 > .6) txt('该出了！', cx + 260, cy - 168, { size: 40, weight: 900, color: '#D62828', font: SERIF, alpha: (a2 - .6) / .4 });
  ctx.restore();
}
function sChart(t) {

  push(t, 0, 12.5, .05, 1200, 520);
  const out = eio(segB(t, 8.6, 9.6));
  ctx.save(); ctx.translate(-700 * out, 0); ctx.globalAlpha *= 1 - out;
  trendChart(t, 1); marker(t);
  ctx.restore();
  // beat 5: the ball doesn't remember — a 7-ball with a question mark
  const bk = winB(t, 4.9, 9.4, .4, .4);

    ctx.save(); ctx.globalAlpha *= bk;
    ctx.fillStyle = 'rgba(6,6,26,0.82)'; ctx.fillRect(0, 0, 680, H);
    const bx = 360, by = 420 + Math.sin(t * 2.2) * 8;

    const g = ctx.createRadialGradient(bx - 30, by - 34, 8, bx, by, 110); g.addColorStop(0, '#FF8A80'); g.addColorStop(1, '#B3261E');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, 110, 0, 6.283); ctx.fill();
    circle(bx, by, 56, '#FFF6EE'); txt('7', bx, by + 26, { size: 76, weight: 900, color: '#B3261E', font: SANS });
    const q = eo(segB(t, 5.4, 6.2));
    txtIn('它不记得', bx, 640, q, { size: 64, weight: 900, font: SERIF });
    const p = eo(segB(t, 7, 7.6));
    const pop = t > B(7) ? 1 + .06 * Math.exp(-(t - B(7)) * 7) : 1;
    ctx.save(); ctx.translate(bx, 770); ctx.scale(pop, pop);
    txtIn('每一期都是 1/10', 0, 0, p, { size: 54, weight: 900, metal: true, font: SERIF });
    ctx.restore();
    ctx.restore();
  }
  ctx.restore();
}
// beat 9.5: Monte Carlo, 1913 — a roulette wheel turning
function sWheel(t) {
  const A = winB(t, 9.3, 12.4, .5, .5);
  if (A <= 0) return;
  ctx.save(); ctx.globalAlpha = A;
  const cx = W / 2, cy = 470, R1 = 300, spin = t * 1.6;
  glow(cx, cy, 520, '255,210,150', .18);
  for (let i = 0; i < 37; i++) {
    const a0 = spin + i / 37 * Math.PI * 2, a1 = a0 + Math.PI * 2 / 37;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R1, a0, a1); ctx.closePath();
    ctx.fillStyle = i === 0 ? '#1F8F5F' : (i % 2 ? '#B3261E' : '#16161C'); ctx.fill();
  }
  circle(cx, cy, R1 * .62, '#5A3A1E'); circle(cx, cy, R1 * .58, '#2A1A10');
  circle(cx, cy, R1 + 14, null, '#C9A96A', 6);
  // the streak counter: 26 blacks
  const n = Math.floor(lerp(1, 26, eio(segB(t, 9.8, 11.6))));
  txt(String(n), cx, cy + 34, { size: 110, weight: 900, color: '#F3DBA4', font: SANS });
  txt('次黑', cx, cy + 92, { size: 34, color: C.ink2 });
  for (let i = 0; i < 26; i++) {
    const on = i < n; const bx = W / 2 - 25 * 34 / 2 + i * 34, by = 840;
    circle(bx, by, 12, on ? '#16161C' : 'rgba(255,255,255,0.08)', on ? 'rgba(242,237,227,0.6)' : null, 2);
  }
  ctx.restore();
}

// ---------------- full episode scenes ----------------
function wheel(cx, cy, R1, spin, streak, t) {
  glow(cx, cy, R1 * 1.7, '255,210,150', .16);
  for (let i = 0; i < 37; i++) {
    const a0 = spin + i / 37 * Math.PI * 2, a1 = a0 + Math.PI * 2 / 37;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R1, a0, a1); ctx.closePath();
    ctx.fillStyle = i === 0 ? '#1F8F5F' : (i % 2 ? '#B3261E' : '#16161C'); ctx.fill();
  }
  circle(cx, cy, R1 * .62, '#5A3A1E'); circle(cx, cy, R1 * .58, '#2A1A10');
  circle(cx, cy, R1 + 12, null, '#C9A96A', 6);
  if (streak !== undefined) { txt(String(streak), cx, cy + R1 * .12, { size: R1 * .36, weight: 900, color: '#F3DBA4', font: SANS }); txt('次黑', cx, cy + R1 * .32, { size: R1 * .11, color: C.ink2 }); }
}
function sMonte(t) {
  scene(t, 18, 34.6, A => {
    const n = Math.floor(lerp(4, 26, eio(segB(t, 21.5, 28.4))));
    wheel(470, 450, 250, t * 1.6, n, t);
    // a player's paper scorecard: Rouge / Noir
    paperCard(1000, 160, 560, 640, .02, 1, (w, h) => {
      pText('MONTE-CARLO · 18 AOÛT 1913', w / 2, 56, 20, { align: 'center', ls: 3, color: C.pInk2 });
      line(40, 76, w - 40, 76, C.pInk3, 1.5);
      pText('ROUGE', w * .3, 120, 30, { align: 'center', weight: 700, color: C.seal });
      pText('NOIR', w * .7, 120, 30, { align: 'center', weight: 700 });
      line(w / 2, 90, w / 2, h - 40, C.pInk3, 1.5);
      for (let i = 0; i < n; i++) { const c = i % 13, r = Math.floor(i / 13); circle(w * .7 - 60 + r * 120, 160 + c * 34, 10, C.pInk); }
      pText('记分卡·示意', w - 30, h - 18, 15, { font: SANS, align: 'right', color: C.pInk2 });
    });
    // chips pile up on ROUGE as the streak grows, then vanish
    const ck = eo(segB(t, 24.5, 26)), gone = eio(segB(t, 30.6, 31.6));
    for (let i = 0; i < 26 * ck; i++) {
      const x = 800 + (i % 6) * 30, y = 800 - Math.floor(i / 6) * 16;
      ctx.save(); ctx.globalAlpha *= 1 - gone; ctx.translate(0, -gone * 120 * ((i % 5) / 5));
      ctx.beginPath(); ctx.ellipse(x, y, 22, 9, 0, 0, 6.283); ctx.fillStyle = i % 3 ? '#C2302B' : '#E8B85C'; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.stroke();
      ctx.restore();
    }
    if (gone > 0) txtIn('数百万法郎', 870, 760, gone, { size: 54, weight: 900, color: C.redHi });
  });
}
function sNoMemory(t) {

      const k = eo(segB(t, 34.6 + i * .4, 35.2 + i * .4)); if (k <= 0) continue;
      const x = 260 + i * 233;
      ctx.save(); ctx.globalAlpha *= k;

      txt(i < 6 ? `第 ${i + 21} 次` : '第 27 次', x, 530, { size: 26, color: i === 6 ? C.goldHi : C.ink2 });
      txt('18/37', x, 590, { size: 44, weight: 900, color: i === 6 ? C.goldHi : C.ink, font: SANS });
      ctx.restore();
    }
    const rk = eo(segB(t, 40.5, 41.2));
    if (rk > 0) {
      ctx.save(); ctx.globalAlpha *= rk;
      txt('连开 26 次同一种颜色', W / 2, 690, { size: 36, color: C.ink2 });
      popTxt('约 6840 万分之一', W / 2, 790, t, 43.5, { size: 84, weight: 900, color: C.goldHi, font: SANS });
      ctx.restore();
    }
  });
}
function sSmall(t) {
  scene(t, 50, 64.6, A => {
    // running share of heads: noisy at first, settling near 50%
    const x0 = 260, x1 = 1660, y0 = 720, y1 = 260, N = 1000;
    const r = rng(23); let h = 0; const pts = [];
    for (let i = 1; i <= N; i++) { h += r() < .5 ? 1 : 0; pts.push(h / i); }
    pts[0] = 1; pts[1] = 1; pts[2] = 2 / 3;
    const X = i => x0 + (x1 - x0) * Math.log10(i) / 3, Y = p => lerp(y0, y1, p);
    line(x0, Y(.5), x1, Y(.5), 'rgba(242,237,227,0.35)', 2);
    txt('50%', x0 - 16, Y(.5) + 8, { size: 26, color: C.ink2, align: 'right' });
    [1, 10, 100, 1000].forEach(n => txt(n + ' 次', X(n), y0 + 44, { size: 26, color: C.ink3 }));
    const k = eio(segB(t, 53.5, 59.5)), m = Math.max(2, Math.floor(N ** k));
    ctx.save(); ctx.strokeStyle = '#E8B85C'; ctx.lineWidth = 4; ctx.beginPath();
    for (let i = 1; i <= m; i++) { const px = X(i), py = Y(pts[i - 1]); i === 1 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }

    txt('正面占比', x0, y1 - 40, { size: 28, color: C.ink2, align: 'left' });
    const dk = eo(segB(t, 59.5, 60.3));
    if (dk > 0) {
      ctx.save(); ctx.globalAlpha *= dk; ctx.fillStyle = 'rgba(6,6,26,0.8)'; ctx.fillRect(0, 150, W, 720); ctx.restore();
      docCard(560, 170, 800, 540, -.01, segB(t, 59.5, 60.6), { top: ['PSYCHOLOGICAL BULLETIN · 1971'], title: ['Belief in the Law', 'of Small Numbers'], author: 'AMOS TVERSKY  &  DANIEL KAHNEMAN', seal: '小数', sealK: eo(segB(t, 61.6, 62.2)) }, t);
    }

}
function coinRow(x, y, seq, k, label, size = 92) {
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha *= k;
  txt(label, x - 90, y + 16, { size: 64, weight: 900, italic: true, font: LATIN, color: C.goldHi });
  [...seq].forEach((c, i) => {
    const cx = x + i * (size + 22), heads = c === '正';
    const g = ctx.createRadialGradient(cx - 14, y - 16, 4, cx, y, size / 2); g.addColorStop(0, heads ? '#FFE7A8' : '#D9DCE3'); g.addColorStop(1, heads ? '#B8862E' : '#7A7F8C');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, y, size / 2, 0, 6.283); ctx.fill();
    txt(c, cx, y + 14, { size: 38, weight: 900, color: '#2A1C08' });
  });
  ctx.restore();
}
function sCoins(t) {

  scene(t, 79.2, 87.6, A => {
    coinRow(400, 280, '正反正反正反', 1, 'A', 70);
    coinRow(400, 420, '正正正正正正', 1, 'B', 70);
    popTxt('1/64', 1520, 300, t, 79.4, { size: 64, weight: 900, color: C.goldHi, font: SANS });
    popTxt('1/64', 1520, 440, t, 79.6, { size: 64, weight: 900, color: C.goldHi, font: SANS });

    ctx.strokeStyle = 'rgba(242,237,227,0.8)'; ctx.lineWidth = 6; ctx.strokeRect(hx - 90, hy - 140, 180, 120);
    ctx.strokeStyle = '#E07A2E'; ctx.beginPath(); ctx.ellipse(hx, hy, 70, 14, 0, 0, 6.283); ctx.stroke();
    for (let i = -3; i <= 3; i++) line(hx + i * 20, hy + 6, hx + i * 12, hy + 90, 'rgba(242,237,227,0.5)', 2);
    const u = (t * .8) % 1, bx = lerp(hx - 320, hx, u), by = lerp(hy + 220, hy, u) - Math.sin(u * Math.PI) * 260;
    circle(bx, by, 40, '#E07A2E', '#5A2A08', 3);
    docCard(720, 150, 520, 600, -.02, segB(t, 91, 92), { top: ['COGNITIVE PSYCHOLOGY · 1985'], title: ['The Hot Hand', 'in Basketball'], titleSize: 36, author: 'GILOVICH · VALLONE · TVERSKY', seal: '错觉', sealK: eo(segB(t, 92.6, 93.2)) }, t);
    docCard(1300, 190, 520, 600, .02, segB(t, 95, 96), { top: ['ECONOMETRICA · 2018'], title: ['Surprised by the', 'Hot Hand Fallacy?'], titleSize: 34, author: 'MILLER  &  SANJURJO', seal: '反转', sealK: eo(segB(t, 96.6, 97.2)) }, t);
  });

function sMemory(t) {
  scene(t, 100, 118.6, A => {
    const col = (x, title, items, b, color) => {
      const k = eo(segB(t, b, b + .6)); if (k <= 0) return;
      ctx.save(); ctx.globalAlpha *= k;

      items.forEach((s, i) => { const ik = eo(segB(t, b + .4 + i * .3, b + 1 + i * .3)); rrect(x - 200, 310 + i * 110 - 40, 400, 84, 14); ctx.fillStyle = 'rgba(242,237,227,0.08)'; ctx.fill(); txtIn(s, x, 310 + i * 110 + 14, ik, { size: 38, weight: 700 }); });
      ctx.restore();
    };
    col(480, '没有记忆', ['硬币', '骰子', '彩票', '轮盘'], 106.5, C.ink);
    col(1440, '有记忆', ['投篮手感', '身体疲劳', '天气'], 110, C.goldHi);
    const gk = eo(segB(t, 114, 114.6));

    const pk = winB(t, 100.3, 106.6, .4, .4);
    if (pk > 0) { popTxt('投篮手感：可能是真的', W / 2, 420, t, 100.5, { size: 76, weight: 900, color: C.goldHi, alpha: pk }); txtIn('人会累 · 会紧张 · 会进入状态', W / 2, 560, pk * eo(segB(t, 103.5, 104.2)), { size: 46, color: C.ink }); }
  });
}
